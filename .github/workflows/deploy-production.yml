name: Deploy Tasks to production
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sanaa-tasks-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify application
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Create standalone release archive
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js
          mkdir -p release/.next
          cp -a .next/standalone/. release/
          cp -a .next/static release/.next/static
          cp -a public release/public
          test -s release/server.js
          tar -C release -czf "tasks-${GITHUB_SHA}.tar.gz" .
      - name: Configure verified SSH transport
        env:
          DEPLOY_KEY: ${{ secrets.SANA_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.SANA_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" || { echo "Missing SANA_DEPLOY_KEY secret"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "Missing SANA_DEPLOY_KNOWN_HOSTS secret"; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
      - name: Upload and activate release
        run: |
          set -euo pipefail
          SCP=(scp -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15)
          SSH=(ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15)
          "${SCP[@]}" "tasks-${GITHUB_SHA}.tar.gz" \
            "sana-deploy@209.42.23.12:/home/sana-deploy/incoming/tasks-${GITHUB_SHA}.tar.gz"
          "${SSH[@]}" sana-deploy@209.42.23.12 \
            "sudo -n /usr/local/sbin/sana-deploy-release tasks ${GITHUB_SHA}"
