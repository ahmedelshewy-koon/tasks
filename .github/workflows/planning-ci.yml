name: Planning PR Validation
on:
  push:
    branches:
      - feature/enterprise-project-planning
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  postgres-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: task_ci
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: task_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_ci -d task_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify additive upgrade on isolated PostgreSQL
        env:
          CI: "true"
          DATABASE_URL: postgres://task_ci:ci_only@127.0.0.1:5432/task_ci
        run: npx tsx scripts/verify-planning-postgres.ts
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run setup:local
      - name: Start isolated development app
        run: |
          TASK_DATA_DIR=/tmp/sanaa-planning-browser-ci npm run dev > /tmp/planning-next.log 2>&1 &
          for i in $(seq 1 100); do
            if curl --silent --fail http://127.0.0.1:3107 > /dev/null; then exit 0; fi
            sleep 2
          done
          tail -120 /tmp/planning-next.log
          exit 1
      - name: Verify enterprise planning in browser
        env:
          CI: "true"
          TASK_TEST_URL: http://127.0.0.1:3107
        run: node scripts/verify-planning-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planning-browser-artifacts
          path: .data/verification
          if-no-files-found: ignore
